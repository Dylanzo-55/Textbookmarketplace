<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TextbookMarketPlace Admin Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../CSS/stylesheetadmin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <header class="mb-4">
        <div class="container d-flex align-items-center justify-content-between py-3">
            <div class="logo">
                <img src="../Pictures_for_website/logo.png" alt="Logo" style="height:48px;">
            </div>
            <nav>
                <ul class="nav">
                    <li class="nav-item"><a href="admin.html" class="nav-link active">Admin</a></li>
                    <li class="nav-item"><a href="../index.html" class="nav-link"><i class='fa fa-sign-out' title='Log out'></i></a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container">
        <section class="mb-5">
            <h2 class="text-center mb-4">Admin Management</h2>
            <div id="admin-users" class="mb-5">
                <h3 class="text-center mb-3">All Users</h3>
                <div class="table-responsive">
                    <div id="user-list"></div>
                </div>
            </div>
            <div id="admin-books">
                <h3 class="text-center mb-3">All Textbooks</h3>
                <div class="table-responsive">
                    <div id="book-list"></div>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Fetch and display users
    function loadUsers() {
        fetch('../PHP/admin_fetch_users.php')
            .then(res => res.text())
            .then(html => document.getElementById('user-list').innerHTML = html);
    }
    // Fetch and display textbooks
    function loadBooks() {
        fetch('../PHP/admin_fetch_books.php')
            .then(res => res.text())
            .then(html => document.getElementById('book-list').innerHTML = html);
    }
    // Delete user
    function deleteUser(username) {
        if (confirm('Delete user ' + username + '?')) {
            fetch('../PHP/admin_delete_user.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'username=' + encodeURIComponent(username)
            }).then(() => loadUsers());
        }
    }
    // Delete book
    function deleteBook(isbn) {
        if (confirm('Delete textbook ISBN ' + isbn + '?')) {
            fetch('../PHP/admin_delete_book.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'isbn=' + encodeURIComponent(isbn)
            }).then(() => loadBooks());
        }
    }
    // Update user (simple prompt for password)
    function updateUser(username) {
        const newPass = prompt('Enter new password for ' + username + ':');
        if (newPass) {
            fetch('../PHP/admin_update_user.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(newPass)
            }).then(() => loadUsers());
        }
    }
    // Make user admin
    function makeAdmin(username) {
        if (confirm('Make ' + username + ' an admin?')) {
            fetch('../PHP/admin_make_admin.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'username=' + encodeURIComponent(username)
            }).then(() => loadUsers());
        }
    }

    // Initial load
    loadUsers();
    loadBooks();
    </script>
</body>
</html>
