<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textbook Market Place</title>
    <link rel="stylesheet" href="CSS/stylesheetlogin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="logo">
        <img src="Pictures_for_website/logo.png" alt="Logo" />
    </div>
    <div class="centered-form-container">
        <div class="glass-box" id="login-box">
            <h2 class="form-title">Login</h2>
            <form action="PHP/login.php" method="POST" autocomplete="off">
                <div class="input-icon">
                    <i class="fa fa-user"></i>
                    <input type="text" id="login-username" name="username" placeholder="Username" required>
                </div>
                <div class="input-icon">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="login-password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="form-btn">Login</button>
            </form>
            <div class="switch-link">
                Don't have an account?
                <a href="#" onclick="showSignup();return false;">Register</a>
            </div>
        </div>
        <div class="glass-box" id="signup-box" style="display:none;">
            <h2 class="form-title">Sign Up</h2>
            <form action="PHP/register.php" method="POST" autocomplete="off">
                <div class="input-icon">
                    <i class="fa fa-user"></i>
                    <input type="text" id="signup-username" name="username" placeholder="Username" required>
                </div>
                <div class="input-icon">
                    <i class="fa fa-envelope"></i>
                    <input type="email" id="signup-email" name="email" placeholder="Email" required>
                </div>
                <div class="input-icon">
                    <i class="fa fa-university"></i>
                    <select name="university" id="signup-university" required>
                        <option value="">Select University</option>
                        <option value="Cape Peninsula University of Technology">Cape Peninsula University of Technology</option>
                        <option value="Central University of Technology">Central University of Technology</option>
                        <option value="Cornerstone Institute">Cornerstone Institute</option>
                        <option value="CTU Training Solutions">CTU Training Solutions</option>
                        <option value="Durban University of Technology">Durban University of Technology</option>
                        <option value="EDUVOS">EDUVOS</option>
                        <option value="Helderberg College of Higher Education">Helderberg College of Higher Education</option>
                        <option value="IIE MSA">IIE MSA (formerly Monash South Africa)</option>
                        <option value="IIE Varsity College">IIE Varsity College</option>
                        <option value="Mangosuthu University of Technology">Mangosuthu University of Technology</option>
                        <option value="Milpark Business School">Milpark Business School</option>
                        <option value="Nelson Mandela University">Nelson Mandela University</option>
                        <option value="North-West University">North-West University</option>
                        <option value="Open Window Institute">Open Window Institute</option>
                        <option value="Red & Yellow Creative School of Business">Red & Yellow Creative School of Business</option>
                        <option value="Regenesys Business School">Regenesys Business School</option>
                        <option value="Rhodes University">Rhodes University</option>
                        <option value="SACAP">South African College of Applied Psychology (SACAP)</option>
                        <option value="South African Theological Seminary">South African Theological Seminary</option>
                        <option value="Sefako Makgatho Health Sciences University">Sefako Makgatho Health Sciences University</option>
                        <option value="Sol Plaatje University">Sol Plaatje University</option>
                        <option value="STADIO Higher Education">STADIO Higher Education</option>
                        <option value="St. Augustine College of South Africa">St. Augustine College of South Africa</option>
                        <option value="Stellenbosch University">Stellenbosch University</option>
                        <option value="Tshwane University of Technology">Tshwane University of Technology</option>
                        <option value="University of Cape Town">University of Cape Town</option>
                        <option value="University of Fort Hare">University of Fort Hare</option>
                        <option value="University of Johannesburg">University of Johannesburg</option>
                        <option value="University of KwaZulu-Natal">University of KwaZulu-Natal</option>
                        <option value="University of Limpopo">University of Limpopo</option>
                        <option value="University of Mpumalanga">University of Mpumalanga</option>
                        <option value="University of Pretoria">University of Pretoria</option>
                        <option value="University of South Africa">University of South Africa (UNISA)</option>
                        <option value="University of the Free State">University of the Free State</option>
                        <option value="University of the Western Cape">University of the Western Cape</option>
                        <option value="University of the Witwatersrand">University of the Witwatersrand</option>
                        <option value="University of Venda">University of Venda</option>
                        <option value="University of Zululand">University of Zululand</option>
                        <option value="Vaal University of Technology">Vaal University of Technology</option>
                        <option value="Walter Sisulu University">Walter Sisulu University</option>
                    </select>
                </div>
                <div class="input-icon">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="signup-password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="form-btn">Sign Up</button>
            </form>
            <div class="switch-link">
                Already have an account?
                <a href="#" onclick="showLogin();return false;">Login</a>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2025 TextbookMarketPlace. All rights reserved.</p>
        <p>Contact: textbookmarketplace369@gmail.com for help</p>
    </footer>
    <script>
        function showSignup() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('signup-box').style.display = 'block';
        }
        function showLogin() {
            document.getElementById('login-box').style.display = 'block';
            document.getElementById('signup-box').style.display = 'none';
        }
        // Error alert
        const urlParams = new URLSearchParams(window.location.search);
        const errorMessage = urlParams.get('error');
        if (errorMessage) {
            alert(errorMessage);
        }
    </script>
</body>
</html>
